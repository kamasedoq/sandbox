<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Counter</title>
  <meta name="description" content="Tap counter with lap intervals">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <button type="button" class="half left" data-dir="-1" aria-label="decrement">
      <span class="sign">&minus; tap</span>
    </button>
    <button type="button" class="half right" data-dir="1" aria-label="increment">
      <span class="sign">tap +</span>
    </button>
  </div>

  <div class="center">
    <div class="count-wrap">
      <div class="count">
        <span class="count-num" id="count-num" aria-live="polite" aria-atomic="true">0</span>
      </div>
      <div class="timer idle" id="timer">
        <span class="pulse"></span>
        <span class="timer-value" id="timer-value">00.00s</span>
      </div>
    </div>

    <div class="laps">
      <div class="laps-head">
        <span><span class="laps-label">Laps</span><span class="laps-count" id="laps-count"></span></span>
      </div>
      <p class="laps-empty" id="laps-empty">tap either side to begin</p>
      <ol class="laps-scroll" id="laps-scroll" hidden></ol>
    </div>
  </div>

  <script src="counter.js"></script>
</body>
</html>
